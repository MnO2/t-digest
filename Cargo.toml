[package]
name = "tdigest"
repository = "https://github.com/MnO2/t-digest"
version = "1.0.0"
license = "Apache-2.0"
description = "T-Digest algorithm in Rust"
authors = ["Paul Meng <me@paulme.ng>"]
readme = "README.md"
keywords = ["tdigest", "percentile", "statistics"]
edition = "2021"
rust-version = "1.62"

[dependencies]
serde = { package = "serde", version = "1.0", optional = true, default-features = false }

[dev-dependencies]
criterion = "=0.4.0"
rand = "=0.8.5"
rand_distr = "=0.4.3"
serde_json = "1.0"

[features]
use_serde = ["serde", "serde/derive", "serde/std"]

[[bench]]
name = "tdigest"
harness = false
